<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a team collaborates with Pistead</title>
  <desc>Alice shares her machine, where Pi is signed in to a model provider, with the workspace. Bob starts a session on it that runs as Bob. Carol can write and approve, Dan can send side asks, Erin can read, and a client follows a read-only share link.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="580" rx="16" fill="#ffffff"/>

  <!-- Step labels -->
  <text x="145" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">① Share one subscription</text>
  <text x="490" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">② Work in one session</text>
  <text x="820" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">③ Grant exactly what each needs</text>

  <!-- Host -->
  <rect x="20" y="56" width="250" height="330" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="145" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Alice's machine</text>
  <text x="145" y="106" text-anchor="middle" font-size="12" fill="#57606a">paired host, shared with the workspace</text>

  <rect x="40" y="122" width="210" height="92" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="145" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Pi + model subscription</text>
  <text x="145" y="166" text-anchor="middle" font-size="13" fill="#1f2328">or API keys</text>
  <text x="145" y="188" text-anchor="middle" font-size="12" fill="#7d4e00">🔒 Credentials never leave</text>
  <text x="145" y="204" text-anchor="middle" font-size="12" fill="#7d4e00">this machine</text>

  <rect x="40" y="228" width="210" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="145" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">pistead connector</text>

  <rect x="40" y="286" width="210" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="145" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sandbox per session</text>
  <text x="145" y="332" text-anchor="middle" font-size="12" fill="#57606a">Bob's session runs here,</text>
  <text x="145" y="350" text-anchor="middle" font-size="12" fill="#57606a">as Bob, with Bob's Git</text>

  <!-- Host to server -->
  <line x1="270" y1="250" x2="336" y2="250" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="303" y="272" text-anchor="middle" font-size="11" fill="#57606a">outbound</text>
  <text x="303" y="286" text-anchor="middle" font-size="11" fill="#57606a">WebSocket</text>

  <!-- Workspace / session -->
  <rect x="340" y="56" width="300" height="460" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="490" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Pistead · workspace acme</text>

  <rect x="358" y="102" width="264" height="312" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="374" y="126" font-size="14" font-weight="700" fill="#1f2328">Session: Fix login redirect</text>
  <text x="374" y="144" font-size="12" fill="#57606a">owner Bob · workspace-visible</text>
  <line x1="358" y1="154" x2="622" y2="154" stroke="#d0d7de"/>

  <!-- chat -->
  <rect x="440" y="166" width="170" height="40" rx="8" fill="#ddf4ff"/>
  <text x="450" y="182" font-size="11" font-weight="600" fill="#0969da">Bob · shared message</text>
  <text x="450" y="198" font-size="12" fill="#1f2328">Fix the login redirect</text>

  <rect x="370" y="214" width="200" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="380" y="230" font-size="11" font-weight="600" fill="#57606a">Agent</text>
  <text x="380" y="246" font-size="12" fill="#1f2328">Patched auth.ts, tests pass</text>

  <rect x="370" y="262" width="240" height="52" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="380" y="280" font-size="12" font-weight="600" fill="#1f2328">Approval: git push → fix/login</text>
  <rect x="380" y="288" width="64" height="18" rx="4" fill="#1f883d"/>
  <text x="412" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Approve</text>
  <text x="454" y="301" font-size="11" fill="#57606a">approved by Carol</text>

  <rect x="370" y="322" width="240" height="80" rx="8" fill="#fbefff" stroke="#c297ff" stroke-dasharray="4 3"/>
  <text x="380" y="340" font-size="11" font-weight="600" fill="#8250df">Side ask · work unchanged</text>
  <text x="380" y="358" font-size="12" fill="#1f2328">Dan: why redirect after refresh?</text>
  <text x="380" y="376" font-size="12" fill="#1f2328">Agent: the token is renewed</text>
  <text x="380" y="392" font-size="12" fill="#1f2328">before the redirect runs…</text>

  <rect x="358" y="430" width="264" height="68" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="490" y="456" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">🔗 Share link</text>
  <text x="490" y="476" text-anchor="middle" font-size="12" fill="#57606a">conversation only, read-only,</text>
  <text x="490" y="491" text-anchor="middle" font-size="12" fill="#57606a">no sign-in needed</text>

  <!-- People -->
  <g font-size="13">
    <line x1="700" y1="122" x2="626" y2="186" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="720" cy="122" r="18" fill="#0969da"/>
    <text x="720" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">B</text>
    <text x="748" y="117" font-weight="600" fill="#1f2328">Bob · owner</text>
    <text x="748" y="135" font-size="12" fill="#57606a">every permission</text>

    <line x1="700" y1="202" x2="626" y2="288" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="720" cy="202" r="18" fill="#1f883d"/>
    <text x="720" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">C</text>
    <text x="748" y="197" font-weight="600" fill="#1f2328">Carol</text>
    <rect x="748" y="205" width="40" height="18" rx="9" fill="#dafbe1"/>
    <text x="768" y="218" text-anchor="middle" font-size="11" fill="#1a7f37">write</text>
    <rect x="794" y="205" width="56" height="18" rx="9" fill="#dafbe1"/>
    <text x="822" y="218" text-anchor="middle" font-size="11" fill="#1a7f37">approve</text>

    <line x1="700" y1="282" x2="626" y2="356" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="720" cy="282" r="18" fill="#8250df"/>
    <text x="720" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">D</text>
    <text x="748" y="277" font-weight="600" fill="#1f2328">Dan</text>
    <rect x="748" y="285" width="32" height="18" rx="9" fill="#fbefff"/>
    <text x="764" y="298" text-anchor="middle" font-size="11" fill="#8250df">ask</text>
    <text x="788" y="298" font-size="11" fill="#57606a">side asks only</text>

    <line x1="700" y1="362" x2="626" y2="392" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="720" cy="362" r="18" fill="#57606a"/>
    <text x="720" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">E</text>
    <text x="748" y="357" font-weight="600" fill="#1f2328">Erin · viewer</text>
    <rect x="748" y="365" width="36" height="18" rx="9" fill="#eaeef2"/>
    <text x="766" y="378" text-anchor="middle" font-size="11" fill="#57606a">read</text>
    <text x="792" y="378" font-size="11" fill="#57606a">follows live</text>

    <line x1="700" y1="464" x2="626" y2="464" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <circle cx="720" cy="464" r="18" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="720" y="469" text-anchor="middle" font-size="14" font-weight="700" fill="#57606a">?</text>
    <text x="748" y="459" font-weight="600" fill="#1f2328">Anyone with the link</text>
    <text x="748" y="477" font-size="12" fill="#57606a">no account needed</text>
  </g>

  <!-- Caption -->
  <text x="480" y="546" text-anchor="middle" font-size="13" fill="#1f2328">Alice shares her host once, and the whole team uses its models. Every message runs as the session owner,</text>
  <text x="480" y="564" text-anchor="middle" font-size="13" fill="#1f2328">and each teammate gets only the permissions their role and the owner's grants give them.</text>
</svg>
