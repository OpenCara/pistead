name: Release server
# Pushing a server-v1.2.3 tag (server-v1.2.3-beta.1 for a prerelease) on a commit in main runs CI, then publishes the
# server image, the web app and the backend in one, to ghcr.io/opencara/pistead (1.2.3, 1.2 and latest; only the full
# version for a prerelease). It creates no GitHub release: the image is the release. Once the image is pushed, a release
# (not a prerelease) is deployed by deploy-server.yml, where the production environment configures a deployment server.
on:
  push:
    tags: ["server-v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/release-check.yml
    with:
      prefix: server-

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [check, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image by digest, so the deploy runs exactly what was built here.
      image: ${{ steps.image.outputs.name }}:${{ needs.check.outputs.version }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag (server-v1.2.3) is not itself semver, so the version comes from the check. A prerelease gets only its
      # full version: metadata-action already skips {{major}}.{{minor}} for one, and the guards say so explicitly.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check, docker]
    if: needs.check.outputs.prerelease == 'false'
    uses: ./.github/workflows/deploy-server.yml
    with:
      image: ${{ needs.docker.outputs.image }}
    secrets: inherit
