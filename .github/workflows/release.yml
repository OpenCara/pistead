name: Release pistead (npm)
# Pushing a cli-v1.2.3 tag (cli-v1.2.3-beta.1 for a prerelease) on a commit in main runs CI, then publishes the
# `pistead` connector from packages/cli to npm, a prerelease to the `next` dist-tag. The tag decides the version:
# scripts/set-release-version.mjs sets it in package.json and npm-shrinkwrap.json before building, so no version bump
# needs committing first. The other release lines are in release-check.yml.
# npm auth: a trusted publisher on npmjs.com for this workflow file (release.yml, keep its name) and environment
# `release`, or an NPM_TOKEN secret.
on:
  push:
    tags: ["cli-v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/release-check.yml
    with:
      prefix: cli-

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  npm:
    needs: [check, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tag's version, in the manifest and the shrinkwrap alike (prepublishOnly checks they agree); the build bundles it.
      - name: Set the connector version from the tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/set-release-version.mjs "$VERSION" cli
      # prepublishOnly checks the shrinkwrap and builds dist.
      - name: Publish pistead
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
