name: CI
on:
  # Version tags run this through release.yml before publishing, so tag pushes don't trigger it twice.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3 git util-linux
      - name: Enable sandbox namespaces in the disposable CI VM
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --cap-drop ALL --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --symlink usr/bin /bin --proc /proc --dev /dev -- /usr/bin/true
      - run: pnpm install --frozen-lockfile
      - name: Connector shrinkwrap matches package.json
        run: node packages/cli/scripts/shrinkwrap.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The published CLI, with the web app and migrations `pistead serve` ships, and its server chunk loading.
      - run: pnpm --filter pistead run build
      - run: node packages/cli/dist/pistead.js serve --help
      # The desktop app's main process, pages and connector host bundle (packaging needs macOS and is not run here).
      - run: pnpm --filter @pistead/desktop build
      # The iOS app's JavaScript bundle, as the release archive's Xcode phase builds it with Metro, which resolves imports
      # differently from tsc and Vite (the shared sources' "./types.js" imports broke ios-v0.1.0). The native build needs
      # macOS and runs only in release-ios.yml.
      - name: Mobile app bundles for iOS
        working-directory: apps/mobile
        run: >-
          pnpm exec expo export:embed --entry-file node_modules/expo-router/entry.js --platform ios --dev false
          --minify false --bundle-output "$RUNNER_TEMP/mobile/main.jsbundle" --assets-dest "$RUNNER_TEMP/mobile/assets"
      - run: pnpm test:connected
      # TRUST_PROXY with forwarded requests, on the image's own Node: its health check sends no forwarded headers, so it
      # stayed healthy while every request through a TLS proxy was a 500 (#71).
      - name: Container image builds and serves health, directly and behind a proxy
        run: |
          docker build -t pistead:ci .
          docker run -d --name pistead -p 8787:8787 -e APP_ORIGIN=http://127.0.0.1:8787 -e TRUST_PROXY=true \
            -e SESSION_SECRET=ci-session-secret-ci-session-secret-ci -e VAULT_KEY=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=') pistead:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"databaseProvider":"sqlite"'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"workspaceDatabasesConfigured":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"passwordAuth":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"githubSignup":"invite"'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"passwordSignup":"invite"'
          curl -fsS http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: pistead.example' http://127.0.0.1:8787/api/health | grep -q '"databaseProvider":"sqlite"'
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8787/ | grep -qi '<!doctype html'
          docker rm -f pistead
